<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration Form</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--tg-theme-bg-color, #f4f6f8);
      color: var(--tg-theme-text-color, #111827);
    }
    .card {
      max-width: 460px;
      margin: 0 auto;
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }
    h2 { margin: 0 0 8px; font-size: 20px; }
    .tg-badge {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(36, 129, 204, 0.12);
      color: var(--tg-theme-link-color, #2481cc);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .warn-badge {
      padding: 10px 12px;
      border-radius: 10px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #111827);
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Student Information</h2>
    <div id="tgUserBox" class="tg-badge">Detecting Telegram account...</div>
    <div id="outsideWarn" class="warn-badge">
    </div>
      Please open this form from the Telegram link inside the group so your username can be detected.

    <form id="studentForm">
      <label for="fullName">1. Full Name</label>
      <input type="text" id="fullName" placeholder="Enter your full name" required />

      <label for="location">2. Location</label>
      <input type="text" id="location" placeholder="City / Area" required />

      <label for="phone">3. Phone Number</label>
      <input type="tel" id="phone" placeholder="e.g. 07xxxxxxxxx" required />

      <label for="email">4. Email</label>
      <input type="email" id="email" placeholder="example@gmail.com" required />

      <button type="submit" id="submitBtn">Send</button>
      <div id="status"></div>
    </form>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5pmRu5VHCo3EGpvtFn_wggG98Ir8mbNrQZ2AI4C8CedBU15M2LqdRlKACjtmL1YIBKA/exec";

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
    const tgUserBox = document.getElementById("tgUserBox");
    const outsideWarn = document.getElementById("outsideWarn");

    let detectedUsername = "";
    let detectedName = "";
    let detectedId = "";

    if (user) {
      detectedId = String(user.id || "");
      detectedUsername = user.username || "";
      detectedName = [user.first_name, user.last_name].filter(Boolean).join(" ");

      if (detectedUsername) {
        tgUserBox.textContent = "Telegram Account: @" + detectedUsername;
      } else {
        tgUserBox.textContent = "Telegram Account: " + detectedName + " (No @username set)";
      }
    } else {
      tgUserBox.style.display = "none";
      outsideWarn.style.display = "block";
    }

    document.getElementById("studentForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const btn = document.getElementById("submitBtn");
      const status = document.getElementById("status");

      btn.disabled = true;
      btn.textContent = "Sending...";
      status.textContent = "";

      const payload = {
        username: detectedUsername,
        tgName: detectedName,
        tgId: detectedId,
        fullName: document.getElementById("fullName").value.trim(),
        location: document.getElementById("location").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim()
      };

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          redirect: "follow"
        });

        const result = await res.json();
        if (result.ok) {
          status.style.color = "green";
          status.textContent = "✅ Sent successfully!";
          document.getElementById("studentForm").reset();
          setTimeout(() => tg.close(), 1500);
        } else {
          throw new Error(result.error || "Failed to send");
        }
      } catch (err) {
        status.style.color = "red";
        status.textContent = "❌ Error sending. Please try again.";
        btn.disabled = false;
        btn.textContent = "Send";
      }
    });
  </script>
</body>
</html>
