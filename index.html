<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فۆرمی زانیاری خوێندکاران</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 16px;
      background: var(--tg-theme-bg-color, #f4f6f8);
      color: var(--tg-theme-text-color, #111827);
    }
    .card {
      max-width: 460px;
      margin: 0 auto;
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }
    h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }
    .tg-badge {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(36, 129, 204, 0.12);
      color: var(--tg-theme-link-color, #2481cc);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .warn-badge {
      padding: 10px 12px;
      border-radius: 10px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #111827);
    }
    input.ltr-input {
      direction: ltr;
      text-align: right;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>زانیارییەکانی خوێندکار</h2>
    <div id="tgUserBox" class="tg-badge">دۆزینەوەی هەژماری تێلێگرام...</div>
    <div id="outsideWarn" class="warn-badge">
      تکایە ئەم فۆرمە لە ڕێگەی لینکەکەی ناو گرووپی تێلێگرامەوە بکەرەوە بۆ ئەوەی هەژمارەکەت بە شێوەی خۆکار بناسرێتەوە.
    </div>

    <form id="studentForm">
      <label for="fullName">١. ناوی تەواو</label>
      <input type="text" id="fullName" placeholder="ناوی سیانی یان تەواوت بنووسە" required />

      <label for="location">٢. شوێنی نیشتەجێبوون</label>
      <input type="text" id="location" placeholder="شار / گەڕەک بنووسە" required />

      <label for="phone">٣. ژمارەی مۆبایل</label>
      <input type="tel" id="phone" class="ltr-input" placeholder="0750xxxxxxx" required />

      <label for="email">٤. ئیمەیڵ</label>
      <input type="email" id="email" class="ltr-input" placeholder="example@gmail.com" required />

      <button type="submit" id="submitBtn">ناردن</button>
      <div id="status"></div>
    </form>
  </div>

  <script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5pmRu5VHCo3EGpvtFn_wggG98Ir8mbNrQZ2AI4C8CedBU15M2LqdRlKACjtmL1YIBKA/exec";
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
    const tgUserBox = document.getElementById("tgUserBox");
    const outsideWarn = document.getElementById("outsideWarn");

    let detectedUsername = "";
    let detectedName = "";
    let detectedId = "";

    if (user) {
      detectedId = String(user.id || "");
      detectedUsername = user.username || "";
      detectedName = [user.first_name, user.last_name].filter(Boolean).join(" ");

      if (detectedUsername) {
        tgUserBox.textContent = "هەژماری تێلێگرام: ";
        const span = document.createElement("span");
        span.dir = "ltr";
        span.style.display = "inline-block";
        span.textContent = "@" + detectedUsername;
        tgUserBox.appendChild(span);
      } else {
        tgUserBox.textContent = "هەژماری تێلێگرام: " + detectedName + " (یوزەرنەیمی @ نییە)";
      }
    } else {
      tgUserBox.style.display = "none";
      outsideWarn.style.display = "block";
    }

    document.getElementById("studentForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const btn = document.getElementById("submitBtn");
      const status = document.getElementById("status");

      btn.disabled = true;
      btn.textContent = "دەنێردرێت...";
      status.textContent = "";

      const payload = {
        username: detectedUsername,
        tgName: detectedName,
        tgId: detectedId,
        fullName: document.getElementById("fullName").value.trim(),
        location: document.getElementById("location").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim()
      };

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          redirect: "follow"
        });

        const result = await res.json();
        if (result.ok) {
          status.style.color = "green";
          status.textContent = "✅ زانیارییەکانت بە سەرکەوتوویی نێردران!";
          document.getElementById("studentForm").reset();
          setTimeout(() => tg.close(), 1500);
        } else {
          throw new Error(result.error || "Failed to send");
        }
      } catch (err) {
        status.style.color = "red";
        status.textContent = "❌ کێشەیەک ڕوویدا لە کاتی ناردن، تکایە دووبارە هەوڵبدەرەوە.";
        btn.disabled = false;
        btn.textContent = "ناردن";
      }
    });
  </script>
</body>
</html>
